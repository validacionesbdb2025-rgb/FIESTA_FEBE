<body class="bg-[#06060a] text-white min-h-[100dvh] flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[420px] bg-[#0e0e1a] border border-white/15 rounded-[28px] p-6 shadow-lg">
    <h2 class="text-2xl font-bold text-center text-[#ffae00] mb-4">Registro de Invitación</h2>
    
    <!-- Formulario adaptado para enviar los datos a tu Google Apps Script -->
    <form id="rsvpForm" class="space-y-3">
      <div>
        <label class="block text-sm text-white/80 mb-1">Nombre Completo:</label>
        <input type="text" id="nombre" name="nombre" required 
          class="w-full bg-white/5 border border-white/15 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-[#ffae00]" 
          placeholder="Tu nombre">
      </div>

      <div>
        <label class="block text-sm text-white/80 mb-1">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required 
          class="w-full bg-white/5 border border-white/15 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-[#ffae00]" 
          placeholder="Tu número de teléfono">
      </div>

      <div>
        <label class="block text-sm text-white/80 mb-1">¿Asistirás?</label>
        <select id="asistencia" name="asistencia" 
          class="w-full bg-[#0e0e1a] border border-white/15 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-[#ffae00]">
          <option value="Sí Asistiré">Sí Asistiré</option>
          <option value="No podré asistir">No podré asistir</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" 
        class="w-full bg-[#ffae00] text-black font-bold py-3 rounded-lg mt-4 hover:opacity-95 transition cursor-pointer">
        Confirmar Registro
      </button>
    </form>

    <!-- Mensaje de respuesta -->
    <div id="responseMessage" class="hidden mt-4 text-center text-sm font-semibold"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzEpIBPllhKXPjTKu2pF189zYQx2C4NTMM7Q9PTU9IY8JOFhyeUcgx0qyrTRmbBYwW/exec";

    const form = document.getElementById('rsvpForm');
    const submitBtn = document.getElementById('submitBtn');
    const responseMessage = document.getElementById('responseMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Deshabilitar botón y mostrar estado de carga
      submitBtn.disabled = true;
      submitBtn.innerText = "Enviando...";
      responseMessage.classList.add('hidden');

      // Recopilar los datos del formulario
      const formData = new URLSearchParams();
      formData.append('nombre', document.getElementById('nombre').value);
      formData.append('telefono', document.getElementById('telefono').value);
      formData.append('asistencia', document.getElementById('asistencia').value);

      // Enviar con mode: 'no-cors' para evitar restricciones de redirección de Google Scripts
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: formData
      })
      .then(() => {
        responseMessage.innerText = "¡Registro guardado con éxito!";
        responseMessage.className = "mt-4 text-center text-sm font-semibold text-[#00ff88]";
        responseMessage.classList.remove('hidden');
        form.reset();
      })
      .catch((error) => {
        console.error('Error:', error);
        responseMessage.innerText = "Hubo un error al registrar. Inténtalo de nuevo.";
        responseMessage.className = "mt-4 text-center text-sm font-semibold text-red-400";
        responseMessage.classList.remove('hidden');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Confirmar Registro";
      });
    });
  </script>
</body>
